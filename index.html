<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silvia Zennaro — Video Editor & Director</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #f0f0f0;
      line-height: 1.6;
    }
    header {
      text-align: center;
      padding: 80px 20px 40px;
    }
    h1 { font-size: 3rem; margin: 0 0 8px; }
    .role { font-size: 1.2rem; color: #9aa4b2; margin: 0; }
    main { max-width: 900px; margin: 0 auto; padding: 0 20px 60px; }
    h2 {
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #9aa4b2;
      border-bottom: 1px solid #222a35;
      padding-bottom: 10px;
      margin: 50px 0 24px;
    }
    .video {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
    }
    .video iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .project h3 { margin: 16px 0 4px; font-size: 1.5rem; }
    .meta { color: #9aa4b2; margin: 0 0 12px; font-size: 0.95rem; }
    a { color: #6cb6ff; }
    footer {
      text-align: center;
      color: #6b7684;
      padding: 30px 20px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Silvia Zennaro</h1>
    <p class="role">Video Editor & Director</p>
  </header>

  <main>
    <h2>Progetti</h2>
    <section class="project">
      <div class="video">
        <iframe
          src="https://www.youtube.com/embed/Y6c6GJ4Pm4o"
          title="When It Rains Inside"
          allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen></iframe>
      </div>
      <h3>When It Rains Inside</h3>
      <p class="meta">Anno · Durata · Il tuo ruolo</p>
      <p>Breve sinossi del progetto.</p>
    </section>

    <h2>Contatti</h2>
    <p>
      <a href="https://www.youtube.com/@SylviaZennaro">YouTube</a>
    </p>
  </main>

  <footer>© 2026 Silvia Zennaro</footer>
</body>
</html>
